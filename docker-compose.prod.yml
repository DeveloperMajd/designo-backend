# Production stack for the Designo Strapi backend. Deployed on the shared Oracle VM
# next to RTM: `web` is the external network shared with the one Caddy container that
# terminates HTTPS for every project by subdomain (/opt/apps/proxy on the server), so
# nothing is published on the host here. Caddy proxies
# api.designo.developermajd.com -> designo-backend:1337.
#
# Deploy (on the server, from this file's directory):
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d
#
# Only secrets live in ./.env (see .env.production.example); everything else is here.
name: designo

x-public-url: &public-url https://api.designo.developermajd.com

services:
  strapi:
    build:
      context: .
      args:
        PUBLIC_URL: *public-url
    image: designo-backend:latest
    container_name: designo-backend
    restart: unless-stopped
    # tini as PID 1, so Strapi gets SIGTERM on `docker stop` and zombies are reaped.
    init: true
    # The VM is shared with RTM: cap this container so it can never starve it.
    mem_limit: 1g
    env_file: ./.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "1337"
      PUBLIC_URL: *public-url
      IS_PROXIED: "true"
      DATABASE_CLIENT: sqlite
      # Relative to the app root (/app), so this lands in the strapi-data volume.
      DATABASE_FILENAME: data/designo.sqlite
      CORS_ORIGINS: https://designo.developermajd.com,https://designo-frontend.vercel.app
    volumes:
      - strapi-data:/app/data
      - strapi-uploads:/app/public/uploads
    networks:
      - web

networks:
  web:
    external: true

volumes:
  strapi-data:
  strapi-uploads:
