version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      strapi:
        patterns: ["@strapi/*"]
      # The admin panel needs react and react-dom at the same version.
      react:
        patterns: ["react", "react-dom"]
    ignore:
      # Strapi 5 is a migration with codemods, not a version bump.
      - dependency-name: "@strapi/*"
        update-types: ["version-update:semver-major"]
      # Strapi 4's admin panel needs these majors.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: react-router-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: styled-components
        update-types: ["version-update:semver-major"]
      # Native module built for the Node versions Strapi 4 supports.
      - dependency-name: better-sqlite3
        update-types: ["version-update:semver-major"]
      # Vitest 5 needs Node 22, which Strapi 4 does not support.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      # Types for Koa 3; Strapi 4 runs on Koa 2.
      - dependency-name: "@types/koa"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
